[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-baselines"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "torch>=2.9.1,<=2.15.0", "onnx==1.23.2", "onnxruntime==1.31.1"]

[project.optional-dependencies]
report = ["matplotlib>=3.10"]
cpu = ["torch==2.15.0+cpu"]
cuda = ["torch==2.9.1+cu130"]
shallow = ["xgboost-cpu==3.4.1", "threadpoolctl==3.6.0"]
trees = ["xgboost-cpu==3.4.1", "lightgbm==4.7.0", "catboost==1.2.10", "threadpoolctl==3.6.0"]

[project.scripts]
inference-baselines = "inference_baselines.cli:main"
inference-study = "inference_baselines.study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inference_baselines = ["configs/*.json", "native/*.cpp", "native/*.h"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cuda", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
